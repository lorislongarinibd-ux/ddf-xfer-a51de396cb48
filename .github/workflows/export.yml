name: Export encrypted DDF artifact
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify payload
        run: sha256sum ddf.enc
      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: ddf-encrypted-bridge
          path: ddf.enc
          retention-days: 1
